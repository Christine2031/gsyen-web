# Managed by the GSYEN Alibaba Cloud deployment templates.
# Existing accounts are left intact by systemd-sysusers.
g gsyen-space -
g gsyen -
u gsyen - "GSYEN application service account" /srv/gsyen /usr/sbin/nologin
g gsyen-mail -
u gsyen-mail - "GSYEN mail ingest service account" /srv/gsyen /usr/sbin/nologin
g stalwart -
u stalwart - "GSYEN Stalwart mail service account" /srv/gsyen /usr/sbin/nologin
m gsyen gsyen-space
m gsyen-mail gsyen-space
m stalwart gsyen-space
