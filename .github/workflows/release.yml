name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Verify release tag matches package version
        run: |
          node -e "const expected='v'+require('./package.json').version;if(process.env.GITHUB_REF_NAME!==expected){console.error('Tag '+process.env.GITHUB_REF_NAME+' does not match '+expected);process.exit(1)}"

      - name: Verify Web and Electron sources
        run: |
          npm run build
          npm run test:electron-security

      - name: Verify production mail worker
        run: |
          npm ci --prefix email-worker
          npm --prefix email-worker run check

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Bundle v2ray-core (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/v2fly/v2ray-core/releases/download/v5.49.0/v2ray-windows-64.zip" -OutFile v2ray.zip
          Expand-Archive -Path v2ray.zip -DestinationPath electron/v2ray-core -Force
          # 精简：删掉 23MB 全球 geoip，只保留 224KB 的 CN+内网精简库（配置已用 ext: 引用它）
          Remove-Item electron/v2ray-core/geoip.dat -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path electron/v2ray-core/geoip-only-cn-private.dat)) {
            Invoke-WebRequest -Uri "https://github.com/v2fly/geoip/releases/latest/download/geoip-only-cn-private.dat" -OutFile electron/v2ray-core/geoip-only-cn-private.dat
          }
          Set-Content -Path electron/v2ray-nodes.json -Value $env:V2RAY_NODES -NoNewline
        env:
          V2RAY_NODES: ${{ secrets.V2RAY_NODES }}

      - name: Build Windows
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GSYEN_API_URL: ${{ secrets.VITE_GSYEN_API_URL }}

      - name: Stage Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            ../gsyen-dist/GSYEN-Setup-*.exe
            ../gsyen-dist/latest.yml
          if-no-files-found: error
          retention-days: 3

  build-mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Build Mac
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GSYEN_API_URL: ${{ secrets.VITE_GSYEN_API_URL }}

      - name: Stage Mac release files
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            ../gsyen-dist/GSYEN-Setup-Mac-*.dmg
            ../gsyen-dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete platform set
        run: |
          test -s release-assets/GSYEN-Setup-Windows.exe
          test -s release-assets/GSYEN-Setup-Mac-arm64.dmg
          test -s release-assets/GSYEN-Setup-Mac-x64.dmg
          test -s release-assets/latest.yml
          test -s release-assets/latest-mac.yml

      - name: Publish binaries to R2
        run: |
          aws s3 cp release-assets/GSYEN-Setup-Windows.exe s3://gsyen-releases/GSYEN-Setup-Windows.exe --endpoint-url "$R2_ENDPOINT"
          aws s3 cp release-assets/GSYEN-Setup-Mac-arm64.dmg s3://gsyen-releases/GSYEN-Setup-Mac-arm64.dmg --endpoint-url "$R2_ENDPOINT"
          aws s3 cp release-assets/GSYEN-Setup-Mac-x64.dmg s3://gsyen-releases/GSYEN-Setup-Mac-x64.dmg --endpoint-url "$R2_ENDPOINT"
        env:
          R2_ENDPOINT: https://4dceba8f9d03d121208467416a73c948.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Activate Windows and Mac update manifests
        run: |
          aws s3 cp release-assets/latest.yml s3://gsyen-releases/latest.yml --endpoint-url "$R2_ENDPOINT"
          aws s3 cp release-assets/latest-mac.yml s3://gsyen-releases/latest-mac.yml --endpoint-url "$R2_ENDPOINT"
          aws s3api head-object --bucket gsyen-releases --key GSYEN-Setup-Windows.exe --endpoint-url "$R2_ENDPOINT"
          aws s3api head-object --bucket gsyen-releases --key GSYEN-Setup-Mac-arm64.dmg --endpoint-url "$R2_ENDPOINT"
          aws s3api head-object --bucket gsyen-releases --key GSYEN-Setup-Mac-x64.dmg --endpoint-url "$R2_ENDPOINT"
          aws s3api head-object --bucket gsyen-releases --key latest.yml --endpoint-url "$R2_ENDPOINT"
          aws s3api head-object --bucket gsyen-releases --key latest-mac.yml --endpoint-url "$R2_ENDPOINT"
        env:
          R2_ENDPOINT: https://4dceba8f9d03d121208467416a73c948.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Publish complete GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body: |
            ## macOS 安装说明
            - **Apple Silicon (M1/M2/M3)** → 下载 `GSYEN-Setup-Mac-arm64.dmg`
            - **Intel Mac** → 下载 `GSYEN-Setup-Mac-x64.dmg`

            > **首次打开提示 "已损坏"？** 右键点击 GSYEN.app → 选“打开” → 点“打开”即可。
